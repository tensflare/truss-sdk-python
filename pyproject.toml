[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "truss-sdk"
version = "0.1.0"
description = "Python SDK for the Truss trust infrastructure API"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "pynacl>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
]

[tool.setuptools.packages.find]
include = ["truss_sdk*"]
